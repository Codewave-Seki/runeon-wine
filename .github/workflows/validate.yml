name: Validate patch metadata

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests, patch hashes, and shell syntax of every patch set
        run: for d in patchsets/*/; do RUNEON_WINE_PATCHSET_DEFINITION="${d%/}" scripts/static-check.sh; done

